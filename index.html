<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cylinder Text Animation</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Shippori+Mincho:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #eef1f6;
      --ink: #1b2a4a;
      --panel: rgba(255, 255, 255, .88);
      --line: #c5cddc;
      --accent: #2f5fd0;
      --status-success: #176b3a;
      --status-success-bg: #e7f5eb;
      --status-error: #a12622;
      --status-error-bg: #fdebea;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1b30;
        --ink: #f1e7cf;
        --panel: rgba(20, 34, 58, .9);
        --line: #2d4266;
        --accent: #f2b45a;
        --status-success: #a5d6a7;
        --status-success-bg: rgba(46, 125, 50, .18);
        --status-error: #ffaaa5;
        --status-error-bg: rgba(198, 40, 40, .18);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1b30;
      --ink: #f1e7cf;
      --panel: rgba(20, 34, 58, .9);
      --line: #2d4266;
      --accent: #f2b45a;
      --status-success: #a5d6a7;
      --status-success-bg: rgba(46, 125, 50, .18);
      --status-error: #ffaaa5;
      --status-error-bg: rgba(198, 40, 40, .18);
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ===== scene ===== */
    .scene {
      position: absolute;
      inset: 0 0 var(--avoid, 0px) 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .graphics-hint {
      position: fixed;
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      left: 12px;
      right: 12px;
      z-index: 4;
      margin: 0;
      padding: 2px 0;
      color: var(--ink);
      font-size: clamp(7px, 2vw, 10px);
      line-height: 1.4;
      text-align: center;
      opacity: .4;
      pointer-events: none;
      white-space: nowrap;
    }

    .scene-renderer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .graphics-hint.error {
      color: var(--status-error);
      opacity: 1;
    }

    /* ===== Control panel ===== */
    .panel {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      max-width: 560px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      font-size: 14px;
      z-index: 5;
    }

    .panel summary {
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .panel summary:focus-visible,
    .panel button:focus-visible,
    .panel input:focus-visible,
    .panel select:focus-visible,
    .panel textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .fields {
      padding: 0 16px 14px;
      display: grid;
      gap: 10px;
      max-height: 42vh;
      overflow-y: auto;
    }

    .text-dock {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
      max-width: 562px;
      margin: 0 auto;
      padding: 12px 16px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      font-size: 14px;
      z-index: 5;
    }

    .text-dock[hidden] {
      display: none;
    }

    .settings-category {
      grid-column: 1 / -1;
      margin: 4px 0 -2px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-weight: 600;
    }

    .settings-category.first {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .f {
      display: grid;
      grid-template-columns: 7.5em 1fr 4.6em;
      align-items: center;
      gap: 10px;
    }

    .f[hidden] {
      display: none;
    }

    .f input[type=number] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .f.wide {
      grid-template-columns: 7.5em 1fr;
    }

    .f.font-field {
      grid-template-columns: 7.5em minmax(0, 1fr) auto;
    }

    .f.text-field {
      grid-template-columns: 7.5em minmax(0, 1fr) auto;
    }

    .text-image-actions {
      display: grid;
      gap: 4px;
    }

    .text-image-actions button {
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .file-load-progress {
      grid-column: 2 / -1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 12px;
    }

    .presets .file-load-progress {
      grid-column: 1 / -1;
    }

    .file-load-progress[hidden] {
      display: none;
    }

    .file-load-progress progress {
      flex: 1;
      min-width: 0;
      height: 8px;
      accent-color: var(--accent);
    }

    .file-load-progress span {
      white-space: nowrap;
    }

    .file-load-progress button {
      padding: 3px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .image {
      background-repeat: no-repeat;
    }

    .f.border-style-field {
      grid-template-columns: 7.5em minmax(0, 1fr) auto;
    }

    .border-image-upload {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .font-load-button {
      width: 2.4em;
      height: 2.4em;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .f input[type=text] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background-color: var(--bg);
      color: var(--ink);
      font: inherit;
    }

    .f input[type=text]:-webkit-autofill,
    .f input[type=text]:-webkit-autofill:hover,
    .f input[type=text]:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
      -webkit-text-fill-color: var(--ink);
    }

    .font-load-status {
      grid-column: 2 / -1;
      margin-top: -6px;
      font-size: 12px;
      line-height: 1.3;
      opacity: .75;
    }

    .font-load-status:empty {
      display: none;
    }

    .f textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      line-height: 1.4;
      resize: vertical;
    }

    .f input[type=range] {
      width: 100%;
      accent-color: var(--accent);
    }

    .f input[type=color] {
      justify-self: start;
      width: 3.4em;
      height: 2em;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .f select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .reset-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      --hold-progress: 0;
      --hold-color: #e85d5d;
    }

    .reset-button::before {
      position: absolute;
      z-index: -1;
      inset: 0 auto 0 0;
      width: calc(var(--hold-progress) * 1%);
      background: var(--hold-color);
      opacity: .35;
      content: "";
      pointer-events: none;
    }

    .presets {
      display: grid;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .presets .prow {
      display: flex;
      gap: 8px;
    }

    .presets .json-actions button {
      flex: 1;
    }

    .presets .webp-actions button {
      flex: 1;
    }

    .webp-progress {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      --export-progress: 0;
    }

    .webp-progress::before {
      position: absolute;
      z-index: -1;
      inset: 0 auto 0 0;
      width: calc(var(--export-progress) * 1%);
      background: var(--accent);
      opacity: .3;
      content: "";
      pointer-events: none;
    }

    .presets .prow> :first-child {
      flex: 1;
      min-width: 0;
    }

    .presets select,
    .presets input {
      box-sizing: border-box;
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }

    .presets select {
      background: var(--bg);
    }

    .presets button {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .presets .status {
      min-height: 1.2em;
      font-size: 12px;
      opacity: .8;
    }

    .presets .status[data-kind="success"],
    .presets .status[data-kind="error"] {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      opacity: 1;
    }

    .presets .status[data-kind="success"] {
      color: var(--status-success);
      background: var(--status-success-bg);
    }

    .presets .status[data-kind="error"] {
      color: var(--status-error);
      background: var(--status-error-bg);
    }

    .presets .status[data-kind="success"]::before {
      content: "✓";
      font-weight: 700;
    }

    .presets .status[data-kind="error"]::before {
      content: "!";
      font-weight: 700;
    }

    .namedlg {
      width: min(320px, calc(100vw - 32px));
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }

    .namedlg::backdrop {
      background: rgba(0, 0, 0, .45);
    }

    .namedlg form {
      display: grid;
      gap: 10px;
    }

    .namedlg input {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }

    .namedlg .hint {
      min-height: 1.2em;
      font-size: 12px;
      opacity: .8;
    }

    .namedlg .acts {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .namedlg button {
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .namedlg button[type=submit] {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .btns button {
      flex: 1 1 10em;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .policy-links {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      width: fit-content;
      margin-top: 8px;
      margin-left: auto;
    }

    .policy-link {
      color: var(--accent);
      font-size: 12px;
    }

    .policy-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

  </style>
</head>

<body>
  <main class="scene">
    <canvas class="scene-renderer" id="scene-renderer" aria-hidden="true"></canvas>
  </main>
  <p class="graphics-hint" id="graphics-hint">For the smooth WebGL renderer, enable hardware acceleration in your browser settings.</p>
  <div class="text-dock" id="text-dock" hidden></div>
  <details class="panel" id="panel">
    <summary>Settings</summary>
    <div class="fields" id="fields">
      <div class="policy-links" id="policy-links">
        <a class="policy-link" id="policy-link" href="privacy-policy.html">Privacy Policy</a>
        <a class="policy-link" id="terms-link" href="terms-of-use.html">Terms of Use</a>
      </div>
    </div>
  </details>
  <script>
    /* =========================================================
       Settings (customize by editing these values)
       ========================================================= */
    /* Font suggestions for the input field; any installed font name can also be entered directly. */
    const FONT_PRESETS = ["Arial", "Courier New", "Dela Gothic One", "DotGothic16", "Georgia", "Impact", "Meiryo", "Noto Sans JP", "Segoe Script", "Shippori Mincho", "Yu Gothic", "Yu Mincho", "Zen Maru Gothic"];

    const DEFAULTS = {
      text: "CYLINDER TEXT\nANIMATION",   // Multiple lines are allowed (one row per line).
      separator: "   ✦   ",   // Separator used when repeating the text.
      repeat: true,           // Repeat the text until it fills the circumference.
      radius: 220,            // Cylinder radius (px).
      fontSize: 40,           // Font size (px).
      letterSpacing: 0.1,     // Letter spacing (em).
      fontFamily: "Arial",    // Comma-separated font family names are supported.
      fontWeight: 700,
      textColor: "#f1e7cf",   // Text color.
      strokeColor: "#f2b45a", // Outline color.
      strokeWidth: 1,         // Outline width (px); 0 disables the outline.
      borderMode: "all",
      borderColor: "#f2b45a",
      borderStyle: "dashed",
      borderImage: "",
      borderWidth: 8,
      borderTopSpacing: 8,
      borderBottomSpacing: 8,
      borderRotation: "withText",
      pillarEnabled: false,
      pillarThickness: 200,
      pillarLength: 300,
      pillarVerticalPosition: 0,
      pillarColor: "#f2b45a",
      pillarImageMode: "flat",
      pillarRotation: true,
      pillarReverseRotation: false,
      bgColor: "#0f1b30",     // Background color.
      speed: -36,             // Rotation speed (degrees/second); negative values reverse direction.
      tiltX: 18,              // Front/back tilt (degrees); positive values tilt the top away.
      tiltZ: -8,              // Side-to-side tilt (degrees).
      perspective: 900,       // Perspective strength (px); smaller values create a stronger effect.
      rowGap: 1.4,            // Spacing between rows (multiples of font size).
      alternate: true,        // Alternate rotation direction between rows.
      depthScale: 0.2,        // Additional size reduction for distant text (0-0.9).
      minOpacity: 0.12,       // Opacity at the farthest point.
      fade: 1.5,              // Fade curve toward the back; larger values fade faster.
      mirrorFront: false,     // Mirror text on the front side and un-mirror the back side.
      image: "",
      pillarImage: "",
      paused: false
    };
    const CFG = { ...DEFAULTS };

    /* UI definitions: rebuild=true marks settings that require rebuilding the text layout. */
    const UI = [
      { k: "text", label: "Text", category: "Text appearance", type: "text", multiline: true, rebuild: true },
      { k: "alternate", label: "Alternate direction per row", category: "Text appearance", type: "bool" },
      { k: "separator", label: "Separator", category: "Text appearance", type: "text", rebuild: true },
      { k: "fontFamily", label: "Font", category: "Text appearance", type: "text", list: FONT_PRESETS, rebuild: true },
      { k: "fontSize", label: "Font size", category: "Text appearance", min: 16, max: 96, step: 1, rebuild: true },
      { k: "fontWeight", label: "Weight", category: "Text appearance", min: 100, max: 900, step: 100, rebuild: true },
      { k: "strokeWidth", label: "Outline width", category: "Text appearance", min: 0, max: 8, step: 0.5, rebuild: true },
      { k: "letterSpacing", label: "Letter spacing", category: "Text appearance", min: 0, max: 1, step: 0.01, rebuild: true },
      { k: "rowGap", label: "Row gap", category: "Text appearance", min: 0.8, max: 3, step: 0.05, rebuild: true },
      { k: "mirrorFront", label: "Mirror front side", category: "Text appearance", type: "bool", rebuild: true },
      { k: "repeat", label: "Repeat", category: "Text appearance", type: "bool", rebuild: true },
      {
        k: "borderMode", label: "Border", category: "Border", type: "select", rebuild: true, options: [
          { label: "No border", value: "none" },
          { label: "Top and bottom (all rows)", value: "all" },
          { label: "Top only (all rows)", value: "allTop" },
          { label: "Bottom only (all rows)", value: "allBottom" },
          { label: "Top and bottom (each row)", value: "rows" },
          { label: "Top only (each row)", value: "rowsTop" },
          { label: "Bottom only (each row)", value: "rowsBottom" }
        ]
      },
      {
        k: "borderStyle", label: "Border style", category: "Border", type: "select", rebuild: true, options: [
          { label: "Dotted", value: "dotted" },
          { label: "Dashed", value: "dashed" },
          { label: "Solid", value: "solid" },
          { label: "Double", value: "double" },
          { label: "Image file", value: "image" }
        ]
      },
      { k: "borderWidth", label: "Border width", category: "Border", min: 0.5, max: 96, step: 0.5, rebuild: true },
      { k: "borderTopSpacing", label: "Top spacing", category: "Border", min: 0, max: 48, step: 1, rebuild: true },
      { k: "borderBottomSpacing", label: "Bottom spacing", category: "Border", min: 0, max: 48, step: 1, rebuild: true },
      {
        k: "borderRotation", label: "Border rotation", category: "Border", type: "select", options: [
          { label: "Rotate with text", value: "withText" },
          { label: "Do not rotate", value: "fixed" }
        ]
      },
      { k: "pillarEnabled", label: "Show pillar", category: "Pillar", type: "bool", rebuild: true },
      { k: "pillarThickness", label: "Pillar thickness", category: "Pillar", min: 1, max: 800, step: 1, rebuild: true },
      { k: "pillarLength", label: "Pillar length", category: "Pillar", min: 1, max: 800, step: 1, rebuild: true },
      { k: "pillarVerticalPosition", label: "Pillar vertical position", category: "Pillar", min: -500, max: 500, step: 1, rebuild: true },
      { k: "pillarRotation", label: "Rotate pillar", category: "Pillar", type: "bool" },
      {
        k: "pillarImageMode", label: "Pillar image display", category: "Pillar", type: "select", rebuild: true, options: [
          { label: "Wrap around pillar", value: "wrap" },
          { label: "Show flat image", value: "flat" }
        ]
      },
      { k: "pillarReverseRotation", label: "Reverse rotation", category: "Pillar", type: "bool" },
      { k: "textColor", label: "Text color", category: "Colors", type: "color" },
      { k: "strokeColor", label: "Outline color", category: "Colors", type: "color" },
      { k: "borderColor", label: "Border color", category: "Colors", type: "color" },
      { k: "pillarColor", label: "Pillar color", category: "Colors", type: "color" },
      { k: "bgColor", label: "Background", category: "Colors", type: "color" },
      { k: "radius", label: "Radius", category: "Motion and display", min: 1, max: 400, step: 1, rebuild: true },
      { k: "speed", label: "Rotation speed", category: "Motion and display", min: -180, max: 180, step: 1 },
      { k: "tiltX", label: "Tilt (front/back)", category: "Motion and display", min: -90, max: 90, step: 1 },
      { k: "tiltZ", label: "Tilt (side)", category: "Motion and display", min: -90, max: 90, step: 1 },
      { k: "perspective", label: "Perspective", category: "Motion and display", min: 300, max: 1000, step: 10 },
      { k: "depthScale", label: "Shrink distant text", category: "Motion and display", min: 0, max: 0.9, step: 0.01 },
      { k: "minOpacity", label: "Distant opacity", category: "Motion and display", min: 0, max: 1, step: 0.01 },
      { k: "paused", label: "Pause", category: "Motion and display", type: "bool" }
    ];

    function validateSettings(obj) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) return null;
      const settings = {};
      for (const u of UI) {
        if (!Object.prototype.hasOwnProperty.call(obj, u.k)) continue;
        const v = obj[u.k];
        const valid = u.type === "bool" ? typeof v === "boolean"
          : u.type === "color" ? typeof v === "string" && /^#[\da-f]{6}$/i.test(v)
            : u.type === "select" ? typeof v === "string" && u.options.some(o => o.value === v)
              : u.type === "text" ? typeof v === "string"
                : typeof v === "number" && Number.isFinite(v);
        if (!valid) return null;
        settings[u.k] = v;
      }
      if (Object.prototype.hasOwnProperty.call(obj, "borderImage")) {
        if (typeof obj.borderImage !== "string"
          || (obj.borderImage && !/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$/i.test(obj.borderImage))) return null;
        settings.borderImage = obj.borderImage;
      }
      if (Object.prototype.hasOwnProperty.call(obj, "image")) {
        if (typeof obj.image !== "string"
          || (obj.image && !/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$/i.test(obj.image))) return null;
        settings.image = obj.image;
      }
      if (Object.prototype.hasOwnProperty.call(obj, "pillarImage")) {
        if (typeof obj.pillarImage !== "string"
          || (obj.pillarImage && !/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$/i.test(obj.pillarImage))) return null;

        const type = String.fromCharCode(...bytes.subarray(offset, offset + 4));
        const size = view.getUint32(offset + 4, true);
        const end = offset + 8 + size;
        if (end > bytes.length) throw new Error("Invalid WebP frame data");
        if (type === "ALPH" || type === "VP8 " || type === "VP8L") {
          chunks.push(webpChunk(type, bytes.slice(offset + 8, end)));
        }
        offset = end + (size & 1);
      }
      if (!chunks.some(chunk => String.fromCharCode(...chunk.subarray(0, 4)) === "VP8 "
        || String.fromCharCode(...chunk.subarray(0, 4)) === "VP8L")) {
        throw new Error("WebP image data is missing");
      }
      return chunks;
    }

    function makeAnimatedWebp(width, height, frameChunks, frameDurations) {
      const extended = new Uint8Array(10);
      extended[0] = 2;
      writeUint24(new DataView(extended.buffer), 4, width - 1);
      writeUint24(new DataView(extended.buffer), 7, height - 1);
      const animation = new Uint8Array(6);
      const animationView = new DataView(animation.buffer);
      animationView.setUint16(4, 0, true);
      const chunks = [webpChunk("VP8X", extended), webpChunk("ANIM", animation)];
      const parts = [];
      let bodySize = 4 + chunks.reduce((size, chunk) => size + chunk.length, 0);
      parts.push(new Uint8Array(12), ...chunks);
      frameChunks.forEach((imageChunks, index) => {
        const header = new Uint8Array(16);
        const headerView = new DataView(header.buffer);
        writeUint24(headerView, 6, width - 1);
        writeUint24(headerView, 9, height - 1);
        writeUint24(headerView, 12, frameDurations[index]);
        header[15] = 1;
        const frameDataSize = imageChunks.reduce((size, chunk) => size + chunk.length, 0);
        const framePayloadSize = header.length + frameDataSize;
        const frameChunkSize = 8 + framePayloadSize + (framePayloadSize & 1);
        bodySize += frameChunkSize;
        parts.push(webpChunkHeader("ANMF", framePayloadSize), header, ...imageChunks);
        if (framePayloadSize & 1) parts.push(new Uint8Array(1));
      });
      parts[0].set([82, 73, 70, 70]);
      new DataView(parts[0].buffer).setUint32(4, bodySize, true);
      parts[0].set([87, 69, 66, 80], 8);
      return new Blob(parts, { type: "image/webp" });
    }

    const yieldToBrowser = () => new Promise(resolve => setTimeout(resolve, 0));

    async function drawExportFrame(pixelScale, sceneScale, offsetY, frameSpin, settings, signal, renderer) {
      if (signal.aborted) throw new DOMException("Animated WebP export canceled", "AbortError");
      renderer.render(settings, frameSpin, pixelScale * sceneScale, -offsetY);
      await yieldToBrowser();
      if (signal.aborted) throw new DOMException("Animated WebP export canceled", "AbortError");
    }

    let exportController = null;
    const exportWebp = mk("Download animated WebP", async () => {
      if (exportController) {
        exportController.abort();
        say("Animated WebP export canceled");
        return;
      }
      const frameDuration = 17;
      const maxDuration = 25;
      const maxDimension = 1920;
      const exportSettings = { ...CFG };
      if (!webglRenderer) {
        say("WebGL is not available in this browser", "error");
        return;
      }
      if (!exportSettings.speed) {
        say("Set a non-zero rotation speed to export", "error");
        return;
      }
      if (typeof ImageDecoder !== "function" && (
        isAnimatedImageSource(exportSettings.image)
        || (exportSettings.pillarEnabled && isAnimatedImageSource(exportSettings.pillarImage))
        || (exportSettings.borderMode !== "none" && exportSettings.borderStyle === "image"
          && isAnimatedImageSource(exportSettings.borderImage))
      )) {
        say("Animated image timing cannot be synchronized in this browser", "error");
        return;
      }
      const period = 360 / Math.abs(exportSettings.speed);
      if (period > maxDuration) {
        say("The animation is too long to export at this speed", "error");
        return;
      }
      const periodMs = period * 1000;
      const frameCount = Math.max(1, Math.round(periodMs / frameDuration));
      const startSpin = spin;
      const exportRows = rowsData.map(row => ({
        index: row.index,
        y: row.y,
        phase: row.phase,
        chars: row.chars.map(({ text, a, image }) => ({ text, a, image }))
      }));
      const { width: availableWidth, height: availableHeight } = scene.getBoundingClientRect();
      if (!HTMLCanvasElement.prototype.toBlob) {
        say("Animated WebP export is not supported by this browser", "error");
        return;
      }

      const controller = new AbortController();
      let exportRenderer = null;
      exportController = controller;
      exportWebp.textContent = tr("Cancel export");
      exportWebp.style.setProperty("--export-progress", 0);
      status.dataset.kind = "info";
      status.textContent = `${tr("Exporting animated WebP")} (0/${frameCount})`;
      const checkCanceled = () => {
        if (controller.signal.aborted) {
          const error = new Error("Animated WebP export canceled");
          error.name = "AbortError";
          throw error;
        }
      };
      try {
        if (document.fonts) await document.fonts.ready;
        checkCanceled();
        if (document.fonts) {
          const spec = `${exportSettings.fontWeight} ${exportSettings.fontSize}px ${familyCss(exportSettings.fontFamily)}`;
          await document.fonts.load(spec, exportSettings.text + exportSettings.separator);
          checkCanceled();
        }
        if (exportSettings.image) await decodeImageSource(exportSettings.image);
        if (exportSettings.borderMode !== "none" && exportSettings.borderStyle === "image" && exportSettings.borderImage) {
          await decodeBorderImageSource(exportSettings.borderImage);
        }
        if (exportSettings.pillarEnabled && exportSettings.pillarImage) {
          await decodePillarImageSource(exportSettings.pillarImage);
        }
        checkCanceled();
        const pixelScale = Math.min(2, maxDimension / Math.max(availableWidth, availableHeight));
        const { width: sceneWidth, height: sceneHeight, offsetY, scale: sceneScale } =
          getSceneLayout(exportSettings, availableWidth, availableHeight);
        const width = Math.max(1, Math.round(sceneWidth * sceneScale * pixelScale));
        const height = Math.max(1, Math.round(sceneHeight * sceneScale * pixelScale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        exportRenderer = createWebGLRenderer(canvas, true);
        if (!exportRenderer) throw new Error("Could not create the WebGL export renderer");
        exportRenderer.resize(width, height, 1);
        const exportImage = exportSettings.image ? await decodeImageSource(exportSettings.image) : null;
        const exportBorderImage = exportSettings.borderMode !== "none" && exportSettings.borderStyle === "image"
          && exportSettings.borderImage ? await decodeBorderImageSource(exportSettings.borderImage) : null;
        const exportPillarImage = exportSettings.pillarEnabled && exportSettings.pillarImage
          ? await decodePillarImageSource(exportSettings.pillarImage) : null;
        exportRenderer.setScene(createRenderScene(exportSettings, exportRows, exportImage, exportBorderImage, exportPillarImage));
        const frames = [];
        const frameDurations = Array.from({ length: frameCount }, (_, i) =>
          Math.round((i + 1) * periodMs / frameCount) - Math.round(i * periodMs / frameCount));
        for (let i = 0; i < frameCount; i++) {
          await exportRenderer.setAnimationTime(Math.round(i * periodMs / frameCount));
          await drawExportFrame(pixelScale, sceneScale, offsetY,
            startSpin + Math.sign(exportSettings.speed) * Math.PI * 2 * i / frameCount,
            exportSettings, controller.signal, exportRenderer);
          const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(image => image ? resolve(image) : reject(new Error("WebP frame encoding failed")), "image/webp", 0.95);
          });
          checkCanceled();
          if (blob.type !== "image/webp") {
            say("Animated WebP export is not supported by this browser", "error");
            return;
          }
          frames.push(getWebpFrameChunks(await blob.arrayBuffer()));
          checkCanceled();
          exportWebp.style.setProperty("--export-progress", (i + 1) / frameCount * 100);
          status.textContent = `${tr("Exporting animated WebP")} (${i + 1}/${frameCount})`;
          await new Promise(resolve => requestAnimationFrame(resolve));
        }
        checkCanceled();
        const blob = makeAnimatedWebp(width, height, frames, frameDurations);
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "cylinder-text-animation.webp";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        say("Animated WebP exported", "success");
      } catch (error) {
        if (controller.signal.aborted) {
          say("Animated WebP export canceled");
        } else if (error.message === "Animated image decoding is not supported") {
          say("Animated image timing cannot be synchronized in this browser", "error");
        } else {
          console.error("Animated WebP export failed", error);
          say("Could not export animated WebP", "error");
        }
      } finally {
        exportRenderer?.dispose();
        exportController = null;
        exportWebp.textContent = tr("Download animated WebP");
        exportWebp.style.setProperty("--export-progress", 0);
      }
    });
    exportWebp.classList.add("webp-progress");
    const importJson = mk("Import JSON", () => jsonFile.click());
    const jsonActions = row(exportJson, importJson);
    jsonActions.classList.add("json-actions");
    const webpActions = row(exportWebp);
    webpActions.classList.add("webp-actions");

    function renderSel(selected) {
      sel.innerHTML = "";
      sel.add(new Option(tr("Select a preset"), ""));
      Object.keys(presets).sort().forEach(n => sel.add(new Option(n, n)));
      sel.value = selected && has(selected) ? selected : "";
    }
    sel.onchange = () => {
      if (!has(sel.value)) {
        clearPresetState();
        return;
      }
      applySettings(presets[sel.value]);
      loadedPresetName = sel.value;
      loadedPresetSettings = snapshot();
      say("Loaded preset", "success");
    };
    const commitSave = n => {
      const nextPresets = { ...presets, [n]: snapshot() };
      const error = persist(nextPresets);
      if (!persisted) {
        reportStorageSaveError(error);
        return;
      }
      presets = nextPresets;
      renderSel(n);
      loadedPresetName = n;
      loadedPresetSettings = snapshot();
      say("Saved", "success");
    };
    const openSave = () => {   // Pre-fill the loaded preset name for quick overwrites.
      nameInp.value = has(sel.value) ? sel.value : has(loadedPresetName) ? loadedPresetName : "";
      nameInp.oninput();
      dlg.showModal(); nameInp.select();
    };
    renderSel();
    pr.append(
      row(sel, mk("Save", openSave), mk("Delete", () => {
        if (!has(sel.value)) return;
        const nextPresets = { ...presets };
        delete nextPresets[sel.value];
        const error = persist(nextPresets);
        if (!persisted) {
          reportStorageSaveError(error);
          return;
        }
        presets = nextPresets;
        clearPresetState();
        renderSel();
        say("Deleted", "success");
      })),
      jsonActions,
      jsonLoadProgress.row,
      webpActions,
      status
    );
    pr.appendChild(jsonFile);
    fields.prepend(pr);

    btns.appendChild(reset); fields.appendChild(btns);
    fields.appendChild($("policy-links"));

    const textDock = $("text-dock");
    const syncTextFieldLocation = () => {
      if (panelEl.open) {
        fields.querySelector(".settings-category").after(inputs.text.wrap);
        inputs.text.inp.rows = 3;
        textDock.hidden = true;
      } else {
        textDock.appendChild(inputs.text.wrap);
        inputs.text.inp.rows = 2;
        textDock.hidden = false;
      }
    };
    syncTextFieldLocation();
    // Reduce the scene's available area by the panel height to keep the animation from overlapping it.
    const measure = () => {
      const previousBounds = scene.getBoundingClientRect();
      const controlsTop = textDock.hidden ? panelEl.getBoundingClientRect().top : textDock.getBoundingClientRect().top;
      const avoid = Math.max(0, Math.round(innerHeight - controlsTop)) + 8;
      document.documentElement.style.setProperty("--avoid", avoid + "px");
      updateSceneSettings();
      const nextBounds = scene.getBoundingClientRect();
      if (previousBounds.width !== nextBounds.width || previousBounds.height !== nextBounds.height) {
        renderSceneFrame();
      }
    };
    panelEl.addEventListener("toggle", () => {
      syncTextFieldLocation();
      measure();
    });
    const ro = new ResizeObserver(measure);
    ro.observe(panelEl); ro.observe(document.body);

    // Close the panel when clicking outside it; pointerdown avoids closing it when a slider drag ends outside.
    document.addEventListener("pointerdown", e => {
      if (panelEl.open && !panelEl.contains(e.target)) panelEl.open = false;
    });
    rebuild();
    scheduleFrame();
  </script>
</body>

</html>
