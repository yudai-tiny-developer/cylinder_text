<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cylinder Text Animation</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Shippori+Mincho:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #eef1f6;
      --ink: #1b2a4a;
      --panel: rgba(255, 255, 255, .88);
      --line: #c5cddc;
      --accent: #2f5fd0;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1b30;
        --ink: #f1e7cf;
        --panel: rgba(20, 34, 58, .9);
        --line: #2d4266;
        --accent: #f2b45a;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1b30;
      --ink: #f1e7cf;
      --panel: rgba(20, 34, 58, .9);
      --line: #2d4266;
      --accent: #f2b45a;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ===== scene ===== */
    .scene {
      position: absolute;
      inset: 0 0 var(--avoid, 0px) 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stage {
      transform-origin: center;
    }

    .ring {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .row {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .ch {
      position: absolute;
      left: 0;
      top: 0;
      white-space: pre;
      line-height: 1;
      color: var(--tc, var(--ink));
      will-change: transform, opacity;
      -webkit-text-stroke: var(--sw, 0px) var(--sc, transparent);
      paint-order: stroke fill;
      backface-visibility: visible;
    }

    .border {
      position: absolute;
      box-sizing: border-box;
      border: var(--bw, 2px) var(--bs, solid) var(--bc);
      border-radius: 50%;
      pointer-events: none;
    }

    .hide-back .ch {
      backface-visibility: hidden;
    }

    .f.disabled {
      opacity: .45;
    }

    /* ===== Control panel ===== */
    .panel {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      max-width: 560px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      font-size: 14px;
      z-index: 5;
    }

    .panel summary {
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .panel summary:focus-visible,
    .panel button:focus-visible,
    .panel input:focus-visible,
    .panel select:focus-visible,
    .panel textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .fields {
      padding: 0 16px 14px;
      display: grid;
      gap: 10px;
      max-height: 42vh;
      overflow-y: auto;
    }

    .settings-category {
      grid-column: 1 / -1;
      margin: 4px 0 -2px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-weight: 600;
    }

    .settings-category.first {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .f {
      display: grid;
      grid-template-columns: 7.5em 1fr 4.6em;
      align-items: center;
      gap: 10px;
    }

    .f input[type=number] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .f.wide {
      grid-template-columns: 7.5em 1fr;
    }

    .f.font-field {
      grid-template-columns: 7.5em minmax(0, 1fr) auto;
    }

    .font-load-button {
      width: 2.4em;
      height: 2.4em;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .f input[type=text] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background-color: var(--bg);
      color: var(--ink);
      font: inherit;
    }

    .f input[type=text]:-webkit-autofill,
    .f input[type=text]:-webkit-autofill:hover,
    .f input[type=text]:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
      -webkit-text-fill-color: var(--ink);
    }

    .font-load-status {
      grid-column: 2 / -1;
      margin-top: -6px;
      font-size: 12px;
      line-height: 1.3;
      opacity: .75;
    }

    .font-load-status:empty {
      display: none;
    }

    .f textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      line-height: 1.4;
      resize: vertical;
    }

    .f input[type=range] {
      width: 100%;
      accent-color: var(--accent);
    }

    .f input[type=color] {
      justify-self: start;
      width: 3.4em;
      height: 2em;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .f select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .reset-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      --hold-progress: 0;
      --hold-color: #e85d5d;
    }

    .reset-button::before {
      position: absolute;
      z-index: -1;
      inset: 0 auto 0 0;
      width: calc(var(--hold-progress) * 1%);
      background: var(--hold-color);
      opacity: .35;
      content: "";
      pointer-events: none;
    }

    .presets {
      display: grid;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .presets .prow {
      display: flex;
      gap: 8px;
    }

    .presets .json-actions button {
      flex: 1;
    }

    .presets .webp-actions button {
      flex: 1;
    }

    .webp-progress {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      --export-progress: 0;
    }

    .webp-progress::before {
      position: absolute;
      z-index: -1;
      inset: 0 auto 0 0;
      width: calc(var(--export-progress) * 1%);
      background: var(--accent);
      opacity: .3;
      content: "";
      pointer-events: none;
    }

    .presets .prow> :first-child {
      flex: 1;
      min-width: 0;
    }

    .presets select,
    .presets input {
      box-sizing: border-box;
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }

    .presets select {
      background: var(--bg);
    }

    .presets button {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .presets .status {
      min-height: 1.2em;
      font-size: 12px;
      opacity: .8;
    }

    .namedlg {
      width: min(320px, calc(100vw - 32px));
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }

    .namedlg::backdrop {
      background: rgba(0, 0, 0, .45);
    }

    .namedlg form {
      display: grid;
      gap: 10px;
    }

    .namedlg input {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }

    .namedlg .hint {
      min-height: 1.2em;
      font-size: 12px;
      opacity: .8;
    }

    .namedlg .acts {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .namedlg button {
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .namedlg button[type=submit] {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .btns button {
      flex: 1 1 10em;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .ch {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="stage" id="stage">
      <div class="ring" id="ring"></div>
    </div>
  </main>
  <details class="panel" id="panel">
    <summary>Settings</summary>
    <div class="fields" id="fields"></div>
  </details>
  <script>
    /* =========================================================
       Settings (customize by editing these values)
       ========================================================= */
    /* Font suggestions for the input field; any installed font name can also be entered directly. */
    const FONT_PRESETS = ["Arial", "Courier New", "Dela Gothic One", "DotGothic16", "Georgia", "Impact", "Meiryo", "Noto Sans JP", "Segoe Script", "Shippori Mincho", "Yu Gothic", "Yu Mincho", "Zen Maru Gothic"];

    const DEFAULTS = {
      text: "CYLINDER TEXT\nANIMATION",   // Multiple lines are allowed (one row per line).
      separator: "   ✦   ",   // Separator used when repeating the text.
      repeat: true,           // Repeat the text until it fills the circumference.
      radius: 220,            // Cylinder radius (px).
      fontSize: 40,           // Font size (px).
      letterSpacing: 0.1,     // Letter spacing (em).
      fontFamily: "Arial",    // Comma-separated font family names are supported.
      fontWeight: 700,
      textColor: "#f1e7cf",   // Text color.
      strokeColor: "#f2b45a", // Outline color.
      strokeWidth: 0,         // Outline width (px); 0 disables the outline.
      borderMode: "none",
      borderColor: "#f2b45a",
      borderStyle: "solid",
      borderWidth: 8,
      borderTopSpacing: 8,
      borderBottomSpacing: 8,
      borderRotation: "withText",
      bgColor: "#0f1b30",     // Background color.
      speed: -36,             // Rotation speed (degrees/second); negative values reverse direction.
      tiltX: 18,              // Front/back tilt (degrees); positive values tilt the top away.
      tiltZ: -8,              // Side-to-side tilt (degrees).
      perspective: 900,       // Perspective strength (px); smaller values create a stronger effect.
      rowGap: 1.4,            // Spacing between rows (multiples of font size).
      alternate: true,        // Alternate rotation direction between rows.
      depthScale: 0.2,        // Additional size reduction for distant text (0-0.9).
      minOpacity: 0.12,       // Opacity at the farthest point.
      fade: 1.5,              // Fade curve toward the back; larger values fade faster.
      backVisible: true,      // Show the back of the cylinder (mirrored text).
      paused: false
    };
    const CFG = { ...DEFAULTS };

    /* UI definitions: rebuild=true marks settings that require rebuilding the text layout. */
    const UI = [
      { k: "text", label: "Text", category: "Text appearance", type: "text", multiline: true, rebuild: true },
      { k: "separator", label: "Separator", category: "Text appearance", type: "text", rebuild: true },
      { k: "fontFamily", label: "Font", category: "Text appearance", type: "text", list: FONT_PRESETS, rebuild: true },
      { k: "fontWeight", label: "Weight", category: "Text appearance", min: 100, max: 900, step: 100, rebuild: true },
      { k: "strokeWidth", label: "Outline width", category: "Text appearance", min: 0, max: 8, step: 0.5 },
      {
        k: "borderMode", label: "Border", category: "Border", type: "select", rebuild: true, options: [
          { label: "No border", value: "none" },
          { label: "Top and bottom (all rows)", value: "all" },
          { label: "Top and bottom (each row)", value: "rows" }
        ]
      },
      {
        k: "borderStyle", label: "Border style", category: "Border", type: "select", options: [
          { label: "Dotted", value: "dotted" },
          { label: "Dashed", value: "dashed" },
          { label: "Solid", value: "solid" },
          { label: "Double", value: "double" }
        ]
      },
      { k: "borderWidth", label: "Border width", category: "Border", min: 0, max: 24, step: 0.5 },
      { k: "borderTopSpacing", label: "Top spacing", category: "Border", min: 0, max: 48, step: 1, rebuild: true },
      { k: "borderBottomSpacing", label: "Bottom spacing", category: "Border", min: 0, max: 48, step: 1, rebuild: true },
      {
        k: "borderRotation", label: "Border rotation", category: "Border", type: "select", options: [
          { label: "Rotate with text", value: "withText" },
          { label: "Do not rotate", value: "fixed" }
        ]
      },
      { k: "textColor", label: "Text color", category: "Colors", type: "color" },
      { k: "strokeColor", label: "Outline color", category: "Colors", type: "color" },
      { k: "borderColor", label: "Border color", category: "Colors", type: "color" },
      { k: "bgColor", label: "Background", category: "Colors", type: "color" },
      { k: "radius", label: "Radius", category: "Cylinder layout", min: 50, max: 500, step: 1, rebuild: true },
      { k: "fontSize", label: "Font size", category: "Cylinder layout", min: 16, max: 96, step: 1, rebuild: true },
      { k: "letterSpacing", label: "Letter spacing", category: "Cylinder layout", min: 0, max: 1, step: 0.01, rebuild: true },
      { k: "rowGap", label: "Row gap", category: "Cylinder layout", min: 0.8, max: 3, step: 0.05, rebuild: true },
      { k: "repeat", label: "Repeat", category: "Cylinder layout", type: "bool", rebuild: true },
      { k: "alternate", label: "Alternate direction per row", category: "Cylinder layout", type: "bool" },
      { k: "speed", label: "Rotation speed", category: "Motion and display", min: -180, max: 180, step: 1 },
      { k: "tiltX", label: "Tilt (front/back)", category: "Motion and display", min: -90, max: 90, step: 1 },
      { k: "tiltZ", label: "Tilt (side)", category: "Motion and display", min: -90, max: 90, step: 1 },
      { k: "perspective", label: "Perspective", category: "Motion and display", min: 300, max: 1000, step: 10 },
      { k: "depthScale", label: "Shrink distant text", category: "Motion and display", min: 0, max: 0.9, step: 0.01 },
      { k: "minOpacity", label: "Distant opacity", category: "Motion and display", min: 0, max: 1, step: 0.01 },
      { k: "backVisible", label: "Show back side", category: "Motion and display", type: "bool" },
      { k: "paused", label: "Pause", category: "Motion and display", type: "bool" }
    ];

    function migrateLegacySettings(obj) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj) || !Object.prototype.hasOwnProperty.call(obj, "borderSpacing")) return obj;
      const settings = { ...obj };
      if (!Object.prototype.hasOwnProperty.call(settings, "borderTopSpacing")) settings.borderTopSpacing = settings.borderSpacing;
      if (!Object.prototype.hasOwnProperty.call(settings, "borderBottomSpacing")) settings.borderBottomSpacing = settings.borderSpacing;
      delete settings.borderSpacing;
      return settings;
    }

    function validateSettings(obj) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) return null;
      obj = migrateLegacySettings(obj);
      const settings = {};
      for (const u of UI) {
        if (!Object.prototype.hasOwnProperty.call(obj, u.k)) continue;
        const v = obj[u.k];
        const valid = u.type === "bool" ? typeof v === "boolean"
          : u.type === "color" ? typeof v === "string" && /^#[\da-f]{6}$/i.test(v)
            : u.type === "select" ? typeof v === "string" && u.options.some(o => o.value === v)
              : u.type === "text" ? typeof v === "string"
                : typeof v === "number" && Number.isFinite(v);
        if (!valid) return null;
        settings[u.k] = v;
      }
      return Object.keys(settings).length ? settings : null;
    }

    const LAST_SETTINGS_KEY = "cylinderTextLastSettings";
    let lastSettingsLoadFailed = false;
    try {
      const saved = localStorage.getItem(LAST_SETTINGS_KEY);
      const settings = saved ? validateSettings(JSON.parse(saved)) : null;
      if (settings) {
        for (const u of UI) {
          if (!Object.prototype.hasOwnProperty.call(settings, u.k)) continue;
          const value = settings[u.k];
          CFG[u.k] = typeof value === "number" ? Math.min(u.max, Math.max(u.min, value)) : value;
        }
      } else if (saved) lastSettingsLoadFailed = true;
    } catch (e) {
      lastSettingsLoadFailed = true;
    }

    /* =========================================================
       Main logic
       ========================================================= */
    /* Use Japanese when the browser's preferred language is Japanese; otherwise use English. */
    const JA = /^ja/i.test(navigator.languages?.[0] || navigator.language || "en");
    const JA_TRANSLATIONS = {
      "Cylinder Text Animation": "円柱テキスト アニメーション",
      "Settings": "設定", "Text": "文字列", "Separator": "区切り文字", "Font": "フォント", "Weight": "太さ",
      "Text color": "文字色", "Outline color": "縁取りの色", "Outline width": "縁取りの太さ", "Background": "背景色",
      "Border": "枠", "No border": "枠無し", "Top and bottom (all rows)": "全体の上下に枠", "Top and bottom (each row)": "各段の上下に枠", "Border color": "枠の色",
      "Border style": "枠のスタイル", "Solid": "実線", "Dashed": "破線", "Dotted": "点線", "Double": "二重線",
      "Border width": "枠の太さ", "Top spacing": "上の余白", "Bottom spacing": "下の余白", "Border rotation": "枠の回転", "Rotate with text": "文字列と一緒に回転", "Do not rotate": "回転しない",
      "Text appearance": "文字と見た目", "Colors": "色", "Cylinder layout": "円柱の配置", "Motion and display": "動きと表示",
      "Rotation speed": "回転速度", "Tilt (front/back)": "傾き（前後）", "Tilt (side)": "傾き（左右）", "Perspective": "遠近感",
      "Shrink distant text": "奥を縮小", "Distant opacity": "奥の濃さ", "Radius": "半径", "Font size": "文字サイズ", "Letter spacing": "字間",
      "Row gap": "段の間隔", "Each line becomes one row": "1行が1段になります", "Repeat": "繰り返し", "Alternate direction per row": "段ごとに逆回転",
      "Show back side": "裏側を表示", "Pause": "一時停止", "Reset to defaults": "初期値に戻す",
      "Load installed fonts": "インストール済みフォントを読込", "Loaded": "読み込み済み",
      "Couldn't access installed fonts": "フォント一覧を取得できませんでした",
      "Hold for 1 second to reset": "1秒間押し続けて離すと初期値に戻します",
      "Any installed font name (e.g. Arial)": "インストール済みフォント名を入力（例: Meiryo）",
      "Presets": "プリセット", "Select a preset": "プリセットを選択", "Preset name": "プリセット名", "Save": "保存", "Delete": "削除", "Cancel": "キャンセル", "This will overwrite the existing preset": "同じ名前のプリセットを上書きします",
      "Saved": "保存しました", "Deleted": "削除しました", "Loaded preset": "読み込みました",
      "This browser cannot save presets": "このブラウザには保存できません",
      "Could not save current settings": "現在の設定を保存できませんでした",
      "Could not load previous settings": "前回の設定を読み込めませんでした",
      "Download JSON": "JSONを書き出す", "Import JSON": "JSONを読み込む",
      "Settings exported": "設定をJSONに書き出しました", "Settings imported": "設定を読み込みました",
      "Invalid settings JSON": "設定JSONの形式が正しくありません", "Could not read settings file": "設定ファイルを読み込めませんでした",
      "Download animated WebP": "アニメーションWebPを書き出す",
      "Exporting animated WebP": "アニメーションWebPを書き出しています",
      "Animated WebP exported": "アニメーションWebPを書き出しました",
      "Set a non-zero rotation speed to export": "書き出すには回転速度を0以外にしてください",
      "The animation is too long to export at this speed": "この回転速度ではアニメーションが長すぎて書き出せません",
      "Animated WebP export is not supported by this browser": "このブラウザーはアニメーションWebPの書き出しに対応していません",
      "Could not export animated WebP": "アニメーションWebPを書き出せませんでした"
    };
    const tr = s => JA ? (JA_TRANSLATIONS[s] ?? s) : s;
    document.documentElement.lang = JA ? "ja" : "en";
    document.title = tr("Cylinder Text Animation");
    const $ = id => document.getElementById(id);
    $("panel").firstElementChild.textContent = tr("Settings");
    const ring = $("ring"), stage = $("stage");
    const ctx = document.createElement("canvas").getContext("2d");
    let rowsData = [], borderData = [], spin = 0, last = performance.now();
    let rebuildRequest = 0, frameRequest = 0;

    function build() {
      rebuildRequest++;
      ring.innerHTML = ""; rowsData = []; borderData = [];
      const { radius: R, fontSize: fs, letterSpacing: ls, fontWeight: fw } = CFG;
      const family = familyCss(CFG.fontFamily);
      ring.style.fontFamily = family;
      ctx.font = `${fw} ${fs}px ${family}`;

      const lines = CFG.text.split("\n");   // One line becomes one row.
      const C = 2 * Math.PI * R;
      const ys = lines.map((_, r) => (r - (lines.length - 1) / 2) * fs * CFG.rowGap);
      if (CFG.borderMode !== "none") {
        const topOffset = fs / 2 + CFG.borderTopSpacing;
        const bottomOffset = fs / 2 + CFG.borderBottomSpacing;
        const bounds = CFG.borderMode === "all"
          ? [{ top: ys[0] - topOffset, bottom: ys[ys.length - 1] + bottomOffset, topRow: 0, bottomRow: ys.length - 1 }]

      frameChunks.forEach((imageChunks, index) => {
        const header = new Uint8Array(16);
        const headerView = new DataView(header.buffer);
        writeUint24(headerView, 6, width - 1);
        writeUint24(headerView, 9, height - 1);
        writeUint24(headerView, 12, frameDurations[index]);
        header[15] = 1;
        const frameData = new Uint8Array(imageChunks.reduce((n, chunk) => n + chunk.length, 0));
        let offset = 0;
        for (const chunk of imageChunks) {
          frameData.set(chunk, offset);
          offset += chunk.length;
        }
        const framePayload = new Uint8Array(header.length + frameData.length);
        framePayload.set(header);
        framePayload.set(frameData, header.length);
        chunks.push(webpChunk("ANMF", framePayload));
      });
      const bodySize = 4 + chunks.reduce((n, chunk) => n + chunk.length, 0);
      const output = new Uint8Array(8 + bodySize);
      output.set([82, 73, 70, 70]);
      new DataView(output.buffer).setUint32(4, bodySize, true);
      output.set([87, 69, 66, 80], 8);
      let offset = 12;
      for (const chunk of chunks) {
        output.set(chunk, offset);
        offset += chunk.length;
      }
      return new Blob([output], { type: "image/webp" });
    }

    function drawExportFrame(context, width, height, pixelScale, sceneScale, frameSpin) {
      const R = CFG.radius, P = persp(), tx = CFG.tiltX * Math.PI / 180, tz = CFG.tiltZ * Math.PI / 180;
      const cosX = Math.cos(tx), sinX = Math.sin(tx), cosZ = Math.cos(tz), sinZ = Math.sin(tz);
      const centerX = width / 2, centerY = height / 2;
      const transformPoint = (x, y, z) => {
        const rotatedY = y * cosX + z * sinX;
        const rotatedZ = -y * sinX + z * cosX;
        return {
          x: x * cosZ - rotatedY * sinZ,
          y: x * sinZ + rotatedY * cosZ,
          z: rotatedZ
        };
      };
      const project = (x, y, z) => {
        const point = transformPoint(x, y, z);
        const perspectiveScale = P / (P - point.z);
        return {
          x: centerX + point.x * perspectiveScale * pixelScale * sceneScale,
          y: centerY + point.y * perspectiveScale * pixelScale * sceneScale,
          z: point.z
        };
      };
      const projectAxis = (point, axis) => {
        const transformedPoint = transformPoint(point.x, point.y, point.z);
        const transformedAxis = transformPoint(axis.x, axis.y, axis.z);
        const denominator = P - transformedPoint.z;
        const factor = P / (denominator * denominator) * pixelScale * sceneScale;
        return {
          x: factor * (transformedAxis.x * denominator + transformedPoint.x * transformedAxis.z),
          y: factor * (transformedAxis.y * denominator + transformedPoint.y * transformedAxis.z)
        };
      };

      context.fillStyle = CFG.bgColor;
      context.fillRect(0, 0, width, height);
      context.font = `${CFG.fontWeight} ${CFG.fontSize}px ${familyCss(CFG.fontFamily)}`;
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.lineJoin = "round";

      if (CFG.borderMode !== "none" && CFG.borderWidth > 0) {
        context.strokeStyle = CFG.borderColor;
        context.lineWidth = CFG.borderWidth * pixelScale * sceneScale;
        context.setLineDash(CFG.borderStyle === "dashed" ? [8, 5].map(v => v * pixelScale * sceneScale)
          : CFG.borderStyle === "dotted" ? [context.lineWidth, context.lineWidth * 1.5] : []);
        const drawBorder = (border, radiusOffset = 0) => {
          const direction = CFG.alternate && border.row % 2 ? -1 : 1;
          const rotation = CFG.borderRotation === "fixed" ? 0 : direction * frameSpin;
          const radius = R - radiusOffset;
          context.beginPath();
          for (let i = 0; i <= 96; i++) {
            const angle = i * Math.PI * 2 / 96;
            const x0 = radius * Math.cos(angle), z0 = radius * Math.sin(angle);
            const x = x0 * Math.cos(rotation) + z0 * Math.sin(rotation);
            const z = -x0 * Math.sin(rotation) + z0 * Math.cos(rotation);
            const point = project(x, border.y, z);
            if (i === 0) context.moveTo(point.x, point.y);
            else context.lineTo(point.x, point.y);
          }
          context.closePath();
          context.stroke();
        };
        for (const border of borderData) {
          if (CFG.borderStyle === "double") {
            drawBorder(border, CFG.borderWidth * 0.75);
            drawBorder(border, -CFG.borderWidth * 0.75);
          } else drawBorder(border);
        }
        context.setLineDash([]);
      }

      for (let r = 0; r < rowsData.length; r++) {
        const row = rowsData[r];
        const direction = CFG.alternate && r % 2 ? -1 : 1;
        for (const character of row.chars) {
          const angle = character.a + direction * frameSpin + row.phase;
          if (!CFG.backVisible && Math.cos(angle + tx) <= 0) continue;
          const x = R * Math.sin(angle), z = R * Math.cos(angle);
          const point3d = { x, y: row.y, z };
          const projected = project(x, row.y, z);
          const depth = Math.max(0, Math.min(1, (projected.z / R + 1) / 2));
          const depthScale = 1 - CFG.depthScale * (1 - depth);
          const opacity = CFG.minOpacity + (1 - CFG.minOpacity) * Math.pow(depth, CFG.fade);
          const cos = Math.cos(angle), sin = Math.sin(angle);
          const horizontal = projectAxis(point3d, { x: cos, y: 0, z: -sin });
          const vertical = projectAxis(point3d, { x: 0, y: 1, z: 0 });
          context.save();
          context.globalAlpha = opacity;
          context.setTransform(horizontal.x * depthScale, horizontal.y * depthScale,
            vertical.x * depthScale, vertical.y * depthScale, projected.x, projected.y);
          if (CFG.strokeWidth > 0) {
            context.strokeStyle = CFG.strokeColor;
            context.lineWidth = CFG.strokeWidth / depthScale;
            context.strokeText(character.text === " " ? "\u00a0" : character.text, 0, 0);
          }
          context.fillStyle = CFG.textColor;
          context.fillText(character.text === " " ? "\u00a0" : character.text, 0, 0);
          context.restore();
        }
      }
    }

    const exportWebp = mk("Download animated WebP", async () => {
      const frameDuration = 17;
      const maxDuration = 25;
      const maxDimension = 1920;
      if (!CFG.speed) {
        say("Set a non-zero rotation speed to export");
        return;
      }
      const period = 360 / Math.abs(CFG.speed);
      if (period > maxDuration) {
        say("The animation is too long to export at this speed");
        return;
      }
      const frameCount = Math.max(1, Math.round(period * 1000 / frameDuration));
      if (!HTMLCanvasElement.prototype.toBlob) {
        say("Animated WebP export is not supported by this browser");
        return;
      }

      exportWebp.disabled = true;
      exportWebp.style.setProperty("--export-progress", 0);
      const startSpin = spin;
      try {
        if (document.fonts) await document.fonts.ready;
        const pixelScale = Math.min(2, maxDimension / Math.max(avail.w, avail.h));
        const R = CFG.radius, fs = CFG.fontSize, P = persp();
        const frontScale = P / (P - R);
        const w0 = (2 * R + fs * 2) * frontScale + 40;
        const h0 = (Math.max(0, CFG.text.split("\n").length - 1) * fs * CFG.rowGap
          + 2 * R * Math.abs(Math.sin(CFG.tiltX * Math.PI / 180)) + fs * 2) * frontScale + 40;
        const tz = CFG.tiltZ * Math.PI / 180;
        const sceneWidth = w0 * Math.abs(Math.cos(tz)) + h0 * Math.abs(Math.sin(tz));
        const sceneHeight = w0 * Math.abs(Math.sin(tz)) + h0 * Math.abs(Math.cos(tz));
        const sceneScale = Math.min(1, avail.w / sceneWidth, avail.h / sceneHeight);
        const width = Math.max(1, Math.round(sceneWidth * sceneScale * pixelScale));
        const height = Math.max(1, Math.round(sceneHeight * sceneScale * pixelScale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Could not create an export canvas");
        const frames = [];
        const frameDurations = Array(frameCount).fill(frameDuration);
        for (let i = 0; i < frameCount; i++) {
          drawExportFrame(context, width, height, pixelScale, sceneScale,
            startSpin + Math.sign(CFG.speed) * Math.PI * 2 * i / frameCount);
          const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(image => image ? resolve(image) : reject(new Error("WebP frame encoding failed")), "image/webp", 0.95);
          });
          if (blob.type !== "image/webp") {
            say("Animated WebP export is not supported by this browser");
            return;
          }
          frames.push(getWebpFrameChunks(await blob.arrayBuffer()));
          exportWebp.style.setProperty("--export-progress", (i + 1) / frameCount * 100);
          status.textContent = `${tr("Exporting animated WebP")} (${i + 1}/${frameCount})`;
          await new Promise(resolve => setTimeout(resolve, 0));
        }
        const blob = makeAnimatedWebp(width, height, frames, frameDurations);
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "cylinder-text-animation.webp";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        say("Animated WebP exported");
      } catch (error) {
        console.error("Animated WebP export failed", error);
        say("Could not export animated WebP");
      } finally {
        exportWebp.disabled = false;
        exportWebp.style.setProperty("--export-progress", 0);
      }
    });
    exportWebp.classList.add("webp-progress");
    const importJson = mk("Import JSON", () => jsonFile.click());
    const jsonActions = row(exportJson, importJson);
    jsonActions.classList.add("json-actions");
    const webpActions = row(exportWebp);
    webpActions.classList.add("webp-actions");

    function renderSel(selected) {
      sel.innerHTML = "";
      sel.add(new Option(tr("Select a preset"), ""));
      Object.keys(presets).sort().forEach(n => sel.add(new Option(n, n)));
      sel.value = selected && has(selected) ? selected : "";
    }
    sel.onchange = () => {
      if (!has(sel.value)) {
        clearPresetState();
        return;
      }
      applySettings(presets[sel.value]);
      loadedPresetName = sel.value;
      loadedPresetSettings = snapshot();
      say("Loaded preset");
    };
    const commitSave = n => {
      presets[n] = snapshot(); persist(); renderSel(n);
      loadedPresetName = n;
      loadedPresetSettings = snapshot();
      say(persisted ? "Saved" : "This browser cannot save presets");
    };
    const openSave = () => {   // Pre-fill the loaded preset name for quick overwrites.
      nameInp.value = has(sel.value) ? sel.value : has(loadedPresetName) ? loadedPresetName : "";
      nameInp.oninput();
      dlg.showModal(); nameInp.select();
    };
    renderSel();
    pr.append(
      row(sel, mk("Save", openSave), mk("Delete", () => { if (!has(sel.value)) return; delete presets[sel.value]; persist(); clearPresetState(); renderSel(); say("Deleted"); })),
      jsonActions,
      webpActions,
      status
    );
    pr.appendChild(jsonFile);
    fields.prepend(pr);

    btns.appendChild(reset); fields.appendChild(btns);

    if (innerWidth > 700) $("panel").open = true;
    // Reduce the scene's available area by the panel height to keep the animation from overlapping it.
    const panelEl = $("panel"), sceneEl = document.querySelector(".scene");
    const measure = () => {
      const avoid = Math.max(0, Math.round(innerHeight - panelEl.getBoundingClientRect().top)) + 8;
      document.documentElement.style.setProperty("--avoid", avoid + "px");
      avail = { w: sceneEl.clientWidth, h: sceneEl.clientHeight };
      updateSceneSettings();
    };
    const ro = new ResizeObserver(measure);
    ro.observe(panelEl); ro.observe(document.body);

    // Close the panel when clicking outside it; pointerdown avoids closing it when a slider drag ends outside.
    document.addEventListener("pointerdown", e => {
      if (panelEl.open && !panelEl.contains(e.target)) panelEl.open = false;
    });
    rebuild();
    scheduleFrame();
  </script>
</body>

</html>
